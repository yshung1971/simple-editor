name: Build Windows portable

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Frontend type check
        run: npm run check

      - name: Build release executable
        run: npm run tauri build -- --no-bundle

      - name: Check portable size
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/simple-editor.exe"
          if (-not (Test-Path $exe)) { throw "Portable executable was not produced" }
          $size = (Get-Item $exe).Length
          $limit = 20MB
          "Portable executable size: $size bytes"
          if ($size -gt $limit) { throw "Portable executable exceeds the 20 MB budget" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File -Encoding utf8 SHA256.txt
          Compress-Archive -LiteralPath $exe -DestinationPath simple-editor-windows-x64.zip

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: simple-editor-windows-x64
          path: |
            simple-editor-windows-x64.zip
            SHA256.txt
          if-no-files-found: error

